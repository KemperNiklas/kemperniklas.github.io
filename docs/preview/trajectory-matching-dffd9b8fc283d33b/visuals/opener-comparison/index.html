<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening figure — minimal comparison</title>
  <link rel="stylesheet" href="preview.css">
  <script src="../drafts-1-6/action-space-frames.js" defer></script>
  <script src="bond-pairs.js" defer></script>
  <script src="preview.js" defer></script>
</head>
<body>
  <main>
    <figure id="comparison" aria-label="Full generation sequences with structured and componentwise actions">
      <div class="tm-scope">
        <span class="scope-label tm-label">Trajectory Matching</span>
        <div class="comparison-columns">
          <div class="panel structured-panel">
            <h2 class="panel-title">Structured actions</h2>
            <div class="stage" id="structured-stage" role="img" aria-label="Structured generation"></div>
          </div>
          <div class="factorized-scope">
            <span class="scope-label factorized-label">Factorized Discrete Flow Matching</span>
            <div class="panel">
              <h2 class="panel-title">Componentwise edits</h2>
              <div class="stage" id="component-stage" role="img" aria-label="Componentwise generation"></div>
            </div>
          </div>
        </div>
      </div>
    </figure>
    <div class="controls">
      <div class="domain-menu">
        <label for="domain">Domain</label>
        <select id="domain">
          <option value="molecules">Molecules</option>
          <option value="hierarchies">Hierarchies</option>
        </select>
      </div>
      <div class="playback"><button id="play">Play</button><button id="restart" aria-label="Replay animation">↺</button><input id="progress" type="range" min="0" max="1000" value="0" aria-label="Animation progress"></div>
    </div>
  </main>
</body>
</html>

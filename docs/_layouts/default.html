<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f7f6f2">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="site-name" href="{{ '/' | relative_url }}">Niklas Kemper</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a {% if page.url == '/' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">About</a>
          <a {% if page.url == '/publications/' %}aria-current="page"{% endif %} href="{{ '/publications/' | relative_url }}">Publications</a>
          <a {% if page.url == '/blog/' %}aria-current="page"{% endif %} href="{{ '/blog/' | relative_url }}">Blog</a>
        </nav>
      </div>
    </header>

    <main id="content" class="shell page-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <span>&copy; {{ 'now' | date: '%Y' }} Niklas Kemper</span>
        <span>Built with Jekyll and hosted on GitHub Pages.</span>
      </div>
    </footer>
  </body>
</html>
